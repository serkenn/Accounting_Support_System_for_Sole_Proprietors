[project]
name = "shiwake"
version = "0.1.0"
description = "証憑から複式簿記の仕訳を組み立て、根拠を辿れる形で保全するツールキット"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
shiwake = "shiwake.cli:main"

# ── プラグインの拡張点（第13部 §3.2）─────────────────────────
# 公開側は Protocol だけを定義する。具体的な実装名をここに書かない。
[project.entry-points."shiwake.parsers"]
[project.entry-points."shiwake.exporters"]
[project.entry-points."shiwake.meters"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiwake"]

[tool.ruff]
line-length = 100
target-version = "py312"
# 環境によって自作パッケージの分類が変わり、CI だけ import 順で落ちることがある。
# 明示して曖昧さを消す。
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["shiwake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
